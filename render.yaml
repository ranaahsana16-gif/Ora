services:
  - type: worker
    name: ora-whatsapp-server
    env: docker
    dockerContext: ./whatsapp-server
    dockerfilePath: ./whatsapp-server/Dockerfile
    disk:
      name: whatsapp-auth-data
      mountPath: /app/.wwebjs_auth
      sizeGB: 1
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
